<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Ширината е тази на телефона; pinch zoom е на самата страница, затова терминалът
       не се преоразмерява при zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=10, user-scalable=yes">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; padding: 0; background: #1e1e1e; overflow-x: hidden; }
    /* Страницата никога не скролва: WebView-то е точно колкото терминала (височината идва
       в Kotlin през SupaBridge.height), а по-висок от мястото терминал се реже отгоре и
       живите редове остават долу. Така и при zoom видимата част не може да излезе от
       терминала. Височината на body е от terminal.js: в WebView-то 100% и 100vh излизат 0.
       Без overflow: hidden — той спира и местенето при zoom. */
    html, body { overscroll-behavior: none; }
    body { display: flex; flex-direction: column; justify-content: flex-end; }
    #term { flex: none; align-self: flex-start; }
    /* Скролбарът на xterm би отнел ширина от колоните. */
    .xterm .xterm-viewport { scrollbar-width: none; }
    .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
    /* Маркирането е на xterm.js; системното маркиране на страницата би се сбъркало с него. */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
